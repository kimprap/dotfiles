onboarding = false
show_agent_labels_on_pane_borders = true

[keys]
# Prefix remains available; Caps-held shortcuts are generated by Karabiner as
# prefix sequences so the in-app keybind help stays narrow and readable.
prefix = "ctrl+b"

help = "prefix+?"
settings = "prefix+s"
goto = "prefix+g"
workspace_picker = "prefix+w"
edit_scrollback = "prefix+e"
toggle_sidebar = "prefix+b"
open_notification_target = "prefix+o"


focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

switch_tab   = "prefix+1..9"
previous_tab = "prefix+p"
next_tab     = "prefix+n"

# Workspace cycle (Caps+Shift+[ / ] via Karabiner → prefix+[ / ])
previous_workspace = "prefix+["
next_workspace     = "prefix+]"

new_tab = []

# Use wrapper commands for pane/tab creation/closing so panes are numbered per tab.
split_vertical = []
split_horizontal = []
close_pane = []

cycle_pane_next = "prefix+tab"
zoom = "prefix+z"

# Resize: enters a mode in which arrows (and h/j/k/l) adjust pane size (bigger/smaller).
# No dedicated top-level resize_left/right/up/down action fields are exposed (arrows
# are permanent focus aliases outside the mode). Use the direct mode entry then arrows.
resize_mode = "prefix+r"

rename_tab  = "prefix+shift+t"
rename_pane = "prefix+shift+p"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "~/.config/herdr/bin/herdr-actions.py new-tab"
description = "new tab"


[[keys.command]]
key = "prefix+v"
type = "shell"
command = "~/.config/herdr/bin/herdr-actions.py split right"
description = "split right"


[[keys.command]]
key = "prefix+minus"
type = "shell"
command = "~/.config/herdr/bin/herdr-actions.py split down"
description = "split down"


[[keys.command]]
key = "prefix+x"
type = "shell"
command = "~/.config/herdr/bin/herdr-actions.py close"
description = "close pane"


# Direct resize bigger/smaller using arrows (via CLI to server).
# Amount is fraction; tune as needed.
# left/right affect width of current pane; up/down affect height.
[[keys.command]]
key = "ctrl+cmd+left"
type = "shell"
command = "herdr pane resize --direction left --amount 0.05"
description = "resize left"

[[keys.command]]
key = "ctrl+cmd+right"
type = "shell"
command = "herdr pane resize --direction right --amount 0.05"
description = "resize right"

[[keys.command]]
key = "ctrl+cmd+up"
type = "shell"
command = "herdr pane resize --direction up --amount 0.05"
description = "resize up"

[[keys.command]]
key = "ctrl+cmd+down"
type = "shell"
command = "herdr pane resize --direction down --amount 0.05"
description = "resize down"

[theme]
name = "vesper"

[ui]
agent_panel_scope = "all"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

