onboarding = false
show_agent_labels_on_pane_borders = true

[keys]
# Prefix kept for full tmux-like flow (your caps+; still sends ctrl+b)
prefix = "ctrl+b"

# Core navigation + requested actions with prefix-free direct alternatives.
# Direct chords use ctrl+cmd family (generated by caps hold layer in Karabiner).
# Never typed directly by user.
help = ["prefix+?", "ctrl+cmd+slash"]
settings = ["prefix+s", "ctrl+cmd+s"]
goto = ["prefix+g", "ctrl+cmd+g"]
workspace_picker = ["prefix+w", "ctrl+cmd+w"]
edit_scrollback = ["prefix+e", "ctrl+cmd+e"]
toggle_sidebar = ["prefix+b", "ctrl+cmd+b"]
open_notification_target = ["prefix+o", "ctrl+cmd+o"]


focus_pane_left  = ["prefix+h", "ctrl+cmd+h"]
focus_pane_down  = ["prefix+j", "ctrl+cmd+j"]
focus_pane_up    = ["prefix+k", "ctrl+cmd+k"]
focus_pane_right = ["prefix+l", "ctrl+cmd+l"]

switch_tab   = ["prefix+1..9", "ctrl+cmd+1..9"]
previous_tab = ["prefix+p", "ctrl+cmd+["]
next_tab     = ["prefix+n", "ctrl+cmd+]"]

new_tab = []

# Use wrapper commands for pane/tab creation/closing so panes are numbered per tab.
split_vertical = []
split_horizontal = []
close_pane = []

cycle_pane_next = ["prefix+tab", "ctrl+cmd+tab"]

# Resize: enters a mode in which arrows (and h/j/k/l) adjust pane size (bigger/smaller).
# No dedicated top-level resize_left/right/up/down action fields are exposed (arrows
# are permanent focus aliases outside the mode). Use the direct mode entry then arrows.
resize_mode = ["prefix+r", "ctrl+cmd+r"]

rename_tab  = ["prefix+shift+t", "ctrl+cmd+t"]
rename_pane = ["prefix+shift+p", "ctrl+cmd+p"]

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes new-tab"
description = "new tab"

[[keys.command]]
key = "ctrl+cmd+c"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes new-tab"
description = "new tab"

[[keys.command]]
key = "prefix+v"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes split right"
description = "split right"

[[keys.command]]
key = "ctrl+cmd+v"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes split right"
description = "split right"

[[keys.command]]
key = "prefix+minus"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes split down"
description = "split down"

[[keys.command]]
key = "ctrl+cmd+minus"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes split down"
description = "split down"

[[keys.command]]
key = "prefix+x"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes close"
description = "close pane"

[[keys.command]]
key = "ctrl+cmd+x"
type = "shell"
command = "~/.config/herdr/bin/numbered-panes close"
description = "close pane"

# Direct resize bigger/smaller using arrows (via CLI to server).
# Amount is fraction; tune as needed.
# left/right affect width of current pane; up/down affect height.
[[keys.command]]
key = "ctrl+cmd+left"
type = "shell"
command = "herdr pane resize --direction left --amount 0.05"
description = "resize left"

[[keys.command]]
key = "ctrl+cmd+right"
type = "shell"
command = "herdr pane resize --direction right --amount 0.05"
description = "resize right"

[[keys.command]]
key = "ctrl+cmd+up"
type = "shell"
command = "herdr pane resize --direction up --amount 0.05"
description = "resize up"

[[keys.command]]
key = "ctrl+cmd+down"
type = "shell"
command = "herdr pane resize --direction down --amount 0.05"
description = "resize down"

[theme]
name = "gruvbox"

[ui]
agent_panel_scope = "all"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

