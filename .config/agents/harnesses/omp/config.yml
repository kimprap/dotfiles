theme:
  dark: dark-swamp
  light: light
statusLine:
  preset: custom
  separator: none
  sessionAccent: true
  transparent: true
  leftSegments:
    - path
    - model
    - mode
    - token_total
    - context_pct
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
      path:
        abbreviate: true
        maxLength: 40
        stripWorkPrefix: true
      git:
        showBranch: true
        showStaged: true
        showUnstaged: true
        showUntracked: true
symbolPreset: nerd
defaultThinkingLevel: medium
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  dbPath: ""
  bank: ""
  embeddingVariant: en
  polyphonicRecall: false
  enhancedRecall: true
  embeddingModel: nvidia/nemotron-3-embed-1b:free
  embeddingApiUrl: https://openrouter.ai/api/v1
  llmMode: smol
  autoRetain: true
extensions:
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/key-remaps.js
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/plan-artifact-sync.js
lsp:
  formatOnWrite: true
setupVersion: 1
display:
  showTokenUsage: true
task:
  showResolvedModelBadge: true
  agentModelOverrides:
    scout: openai-codex/gpt-5.6-terra:xhigh
hideThinkingBlock: true
providers:
  webSearchExclude:
    - perplexity
  memoryModel: online
  webSearchOrder:
    - brave
    - xai
    - codex
github:
  enabled: true
modelRoles:
  # default: xai-oauth/grok-4.5:xhigh
  default: openai-codex/gpt-5.6-terra:xhigh
  slow: openai-codex/gpt-5.6-sol:xhigh
  plan: openai-codex/gpt-5.6-sol:xhigh
  advisor: openai-codex/gpt-5.6-sol:xhigh
  # smol: xai-oauth/grok-4.5:xhigh
  smol: openai-codex/gpt-5.6-terra:xhigh
  task: openai-codex/gpt-5.6-terra:xhigh
  # tiny: xai-oauth/grok-4.5:medium
  tiny: openai-codex/gpt-5.6-luna:max
vault:
  enabled: true
browser:
  enabled: true
web_search:
  enabled: true
disabledProviders:
  - codex
dev:
  autoqaConsent: granted

