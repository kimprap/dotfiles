theme:
  dark: dark-swamp
  light: light
statusLine:
  preset: custom
  separator: none
  sessionAccent: false
  transparent: true
  leftSegments:
    - path
    - model
    - mode
    - token_total
    - context_pct
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
      path:
        abbreviate: true
        maxLength: 40
        stripWorkPrefix: true
      git:
        showBranch: true
        showStaged: true
        showUnstaged: true
        showUntracked: true
  compactThinkingLevel: false
symbolPreset: nerd
defaultThinkingLevel: medium
tier:
  subagent: inherit
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  dbPath: ""
  bank: ""
  embeddingVariant: en
  polyphonicRecall: false
  enhancedRecall: true
  embeddingModel: nvidia/nemotron-3-embed-1b:free
  embeddingApiUrl: https://openrouter.ai/api/v1
  llmMode: smol
  autoRetain: true
extensions:
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/key-remaps.js
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/plan-artifact-sync.js
lsp:
  formatOnWrite: true
setupVersion: 2
display:
  showTokenUsage: true
task:
  showResolvedModelBadge: true
  agentModelOverrides:
    verification-worker: openai-codex/gpt-5.6-sol:xhigh
    reviewer: openai-codex/gpt-5.6-sol:xhigh
    security-reviewer: openai-codex/gpt-5.6-sol:xhigh
    scout: openai-codex/gpt-5.6-sol:xhigh
    sonic: openai-codex/gpt-5.6-sol:xhigh
    task: openai-codex/gpt-5.6-sol:xhigh
    designer: openai-codex/gpt-5.6-sol:xhigh
    librarian: openai-codex/gpt-5.6-sol:xhigh
hideThinkingBlock: true
providers:
  webSearchExclude:
    - perplexity
  memoryModel: online
  webSearchOrder:
    - brave
    - xai
    - codex
github:
  enabled: true
modelRoles:
  default: openai-codex/gpt-5.6-sol:xhigh
  slow: openai-codex/gpt-5.6-sol:max
  plan: openai-codex/gpt-5.6-sol:max
  advisor: openai-codex/gpt-5.6-sol:xhigh
  smol: xai-oauth/grok-4.6:xhigh
  task: openai-codex/gpt-5.6-sol:xhigh
  tiny: openai-codex/gpt-5.6-sol:xhigh
  designer: openai-codex/gpt-5.6-sol:xhigh
  test_audit_opinion_a: openai-codex/gpt-5.6-sol:xhigh
  test_audit_opinion_b: xai-oauth/grok-4.6:xhigh
  second_opinion_a: openai-codex/gpt-5.6-sol:xhigh
  second_opinion_b: xai-oauth/grok-4.6:xhigh
vault:
  enabled: true
browser:
  enabled: true
web_search:
  enabled: true
disabledProviders:
  - codex
dev:
  autoqaConsent: granted
codexResets:
  autoRedeem: "no"
compaction:
  thresholdTokens: 200000
  idleEnabled: true
composer:
  shape: claude
extendedContext: false
terminal:
  showProgress: true
astGrep:
  enabled: false