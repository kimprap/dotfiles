theme:
  dark: dark-swamp
  light: light
statusLine:
  preset: custom
  separator: none
  sessionAccent: true
  transparent: true
  leftSegments:
    - path
    - model
    - mode
    - token_total
    - context_pct
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
      path:
        abbreviate: true
        maxLength: 40
        stripWorkPrefix: true
      git:
        showBranch: true
        showStaged: true
        showUnstaged: true
        showUntracked: true
symbolPreset: nerd
defaultThinkingLevel: medium
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  dbPath: ""
  bank: ""
  embeddingVariant: en
  polyphonicRecall: false
  enhancedRecall: true
  embeddingModel: nvidia/llama-nemotron-embed-vl-1b-v2:free
  embeddingApiUrl: https://openrouter.ai/api/v1
  llmMode: remote
  llmBaseUrl: https://openrouter.ai/api/v1
  llmModel: nvidia/nemotron-3-ultra-550b-a55b:free
extensions:
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/key-remaps.js
lsp:
  formatOnWrite: true
setupVersion: 1
display:
  showTokenUsage: true
task:
  showResolvedModelBadge: true
hideThinkingBlock: true
providers:
  webSearch: codex
  webSearchExclude:
    - perplexity
  memoryModel: online
github:
  enabled: true
modelRoles:
  task: xai-oauth/grok-build-0.1
  default: openai-codex/gpt-5.4:high
  slow: openai-codex/gpt-5.5
  plan: openai-codex/gpt-5.5
  designer: openai-codex/gpt-5.4
  smol: xai-oauth/grok-build
