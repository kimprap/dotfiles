theme:
  dark: dark-swamp
  light: light
statusLine:
  preset: custom
  separator: none
  sessionAccent: true
  transparent: true
  leftSegments:
    - path
    # - git
    - model
    - mode
    - token_total
    - context_pct
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
      path:
        abbreviate: true
        maxLength: 40
        stripWorkPrefix: true
      git:
        showBranch: true
        showStaged: true
        showUnstaged: true
        showUntracked: true
symbolPreset: nerd
defaultThinkingLevel: medium
memory:
  backend: hindsight
lsp:
  formatOnWrite: true
setupVersion: 1
display:
  showTokenUsage: true
task:
  showResolvedModelBadge: true
hideThinkingBlock: true

