theme: 
  dark: dark-swamp
  light: light
statusLine: 
  preset: custom
  separator: none
  sessionAccent: true
  transparent: true
  leftSegments: 
    - path
    - model
    - mode
    - token_total
    - context_pct
  rightSegments: 
    - session_name
  segmentOptions: 
    model: 
      showThinkingLevel: true
      path: 
        abbreviate: true
        maxLength: 40
        stripWorkPrefix: true
      git: 
        showBranch: true
        showStaged: true
        showUnstaged: true
        showUntracked: true
symbolPreset: nerd
defaultThinkingLevel: medium
memory: 
  backend: mnemopi
mnemopi: 
  scoping: per-project-tagged
  dbPath: ""
  bank: ""
  embeddingVariant: en
  polyphonicRecall: false
  enhancedRecall: true
  embeddingModel: nvidia/nemotron-3-embed-1b:free
  embeddingApiUrl: https://openrouter.ai/api/v1
  llmMode: smol
  autoRetain: true
extensions: 
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/key-remaps.js
  - ~/.dotfiles/.config/agents/harnesses/omp/extensions/plan-artifact-sync.js
lsp: 
  formatOnWrite: true
setupVersion: 1
display: 
  showTokenUsage: true
task: 
  showResolvedModelBadge: true
  agentModelOverrides: 
    reviewer: openai-codex/gpt-5.6-sol:xhigh
    security-reviewer: openai-codex/gpt-5.6-sol:xhigh
    scout: openai-codex/gpt-5.6-luna:max
    sonic: openai-codex/gpt-5.6-luna:max
    task: openai-codex/gpt-5.6-luna:max
    designer: openai-codex/gpt-5.6-luna:max
    librarian: openai-codex/gpt-5.6-luna:max
hideThinkingBlock: true
providers: 
  webSearchExclude: 
    - perplexity
  memoryModel: online
  webSearchOrder: 
    - brave
    - xai
    - codex
github: 
  enabled: true
modelRoles: 
  default: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-sol:xhigh
  plan: openai-codex/gpt-5.6-sol:max
  advisor: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.6-luna:max
  task: openai-codex/gpt-5.6-luna:max
  tiny: openai-codex/gpt-5.6-luna:max
  designer: openai-codex/gpt-5.6-luna:max
vault: 
  enabled: true
browser: 
  enabled: true
web_search: 
  enabled: true
disabledProviders: 
  - codex
dev: 
  autoqaConsent: granted