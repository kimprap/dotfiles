# User remaps for omp. Action IDs documented in omp://keybindings.md.
# Ctrl+Shift+D is remapped away from Debug Tools by extensions/key-remaps.js.
# Use it for macOS-style forward word deletion; keep Ctrl+D as forward-delete
# without exiting.
app.exit: []
tui.editor.deleteCharForward:
  - Delete
  - Ctrl+D
tui.editor.deleteWordForward:
  - Alt+Delete
  - Alt+D
  - Super+Alt+Delete
  - Super+Alt+D
  - Ctrl+Shift+D
