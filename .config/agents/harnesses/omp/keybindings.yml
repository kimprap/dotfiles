# User remaps for omp. Action IDs documented in omp://keybindings.md.
# Ctrl+Shift+D is remapped by ~/.dotfiles/.config/agents/harnesses/omp/extensions/key-remaps.js; Ctrl+Shift+G opens Debug Tools.
# Use it for macOS-style forward word deletion; keep Ctrl+D as forward-delete
# without exiting.
# Esc stays unbound; Ctrl+C remains OMP's hard-exit path, so use Alt+C to abort
# the active agent turn without leaving the TUI.
app.interrupt:
  - Alt+C
app.session.tree:
  - Alt+T
app.exit: []
tui.editor.deleteCharForward:
  - Delete
  - Ctrl+D
tui.editor.deleteWordForward:
  - Alt+Delete
  - Alt+D
  - Super+Alt+Delete
  - Super+Alt+D
  - Ctrl+Shift+D
