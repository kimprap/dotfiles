[memory]
enabled = true

[cli]
installer = "internal"
auto_update = true
show_tips = true

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = false
compact_mode = true
permission_mode = "always-approve"
vim_mode = true
simple_mode = false
theme = "auto"
show_timestamps = true

[subagents]
enabled = true

[subagents.toggle]
browser-use = true

[models]
default = "grok-build"

[marketplace]
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[plugins]
enabled = []
disabled = []

