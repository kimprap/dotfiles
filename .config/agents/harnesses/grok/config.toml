[hints]
memory_modal_fullscreen = true

[memory]
enabled = true

[cli]
installer = "internal"
auto_update = true
show_tips = true

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = false
compact_mode = true
permission_mode = "always-approve"
vim_mode = true
simple_mode = false
theme = "auto"
show_timestamps = true
auto_dark_theme = "groknight"
show_timeline = true

[subagents]
enabled = true

[subagents.toggle]
browser-use = true
planner = true

[subagents.roles.test-audit-opinion-a]
description = "Independent read-only permanent-test value opinion A"
default_capability_mode = "read-only"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
prompt_file = ".config/agents/skills/dev-test-audit/references/opinion-agent.md"
default_isolation = "none"

[subagents.roles.test-audit-opinion-b]
description = "Independent read-only permanent-test value opinion B"
default_capability_mode = "read-only"
model = "grok-4.6"
reasoning_effort = "xhigh"
prompt_file = ".config/agents/skills/dev-test-audit/references/opinion-agent.md"
default_isolation = "none"


[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[plugins]
enabled = []
disabled = []
